<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="%PUBLIC_URL%/brand/favicon-48.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F6F2E9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D1913" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Golfy - find a golf venue, pick a time and book it by the hour."
    />
    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/brand/apple-touch-icon.png"
    />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <style>
      /* shown until React mounts and replaces #root's content */
      .g-splash { min-height: 100vh; display: grid; place-items: center; background: #F6F2E9; }
      .g-splash img { animation: g-splash 1.2s ease-in-out infinite; }
      @keyframes g-splash { 50% { opacity: .45; transform: scale(.94); } }
      @media (prefers-color-scheme: dark) { .g-splash { background: #0D1913; } .g-splash img { content: url(%PUBLIC_URL%/brand/golfy-mark-light.svg); } }
      @media (prefers-reduced-motion: reduce) { .g-splash img { animation: none; } }
      /* picture URLs live here because the CSS bundler would try to resolve them */
      :root { --img-hero: url(/img/hero.jpg?v=3); --img-auth: url(/img/auth.jpg?v=4); }
    </style>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Golfy" />
    <meta property="og:title" content="Golfy: book golf venues by the hour" />
    <meta property="og:description" content="Courses, simulators and driving ranges across Korea, booked by the hour. A portfolio project with fictional venues." />
    <meta property="og:image" content="%PUBLIC_URL%/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Golfy</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="g-splash" role="status" aria-label="Loading Golfy">
        <img src="%PUBLIC_URL%/brand/golfy-mark.svg" alt="" width="64" height="64" />
      </div>
    </div>
  </body>
</html>
